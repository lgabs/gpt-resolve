[tool.poetry]
name = "gpt-resolve"
version = "0.5.0"
description = "AI agent solutions for Brazilian university entrance exams."
authors = ["Luan Fernandes <luangabriel70@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/lgabs/gpt-resolve"
repository = "https://github.com/lgabs/gpt-resolve"
keywords = ["gpt", "education", "exam-solving", "brazil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[tool.poetry.dependencies]
python = "^3.10"
claude-agent-sdk = ">=0.2.170"
python-dotenv = "^1.0.1"
pylatex = "^1.4.2"
tqdm = "^4.67.0"
typer = "^0.13.0"
# typer 0.13 breaks `--help` with click 8.2+
click = ">=8.0,<8.2"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
pytest = "^8.3.3"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
gpt-resolve = "gpt_resolve.resolve:main"
